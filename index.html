<title>ЧҮКӨ Modern 3D — LMS/scenarios 0.13</title>
<link rel="stylesheet" href="styles.css?v=0.13.20">
<style id="shell-size-style"></style>
<script>
// "не помогло": switching the CSS calc from `dvh` to a JS-driven `vh`
// custom property (previous attempt) still didn't fix in-app browsers
// (Telegram/Instagram/VK). Those WebViews can be unreliable not just for
// the `dvh` unit but for `calc()`/`aspect-ratio` sizing math in general.
// This drops CSS viewport math entirely: plain JS computes the exact
// pixel width/height from window.innerWidth and
// window.visualViewport.height (falling back to innerHeight), and writes
// them into a <style> tag as a hard #shell{width:...px;height:...px}
// rule (!important, so it always wins over anything in styles.css
// regardless of load order). Only window.innerWidth/innerHeight and
// visualViewport are used - no vh, dvh, vw, or aspect-ratio math for the
// actual sizing, since those are exactly the pieces that already proved
// unreliable here.
(function () {
  var styleEl = document.getElementById('shell-size-style');
  var RATIO = 941 / 1672; // width / height

  function layoutShell() {
    var vw = window.innerWidth || document.documentElement.clientWidth || 360;
    var vh = (window.visualViewport && window.visualViewport.height)
      || window.innerHeight
      || document.documentElement.clientHeight
      || 640;
    if (!vw || !vh) return;
    var w = Math.min(vw, 560, vh * RATIO);
    var h = w / RATIO;
    if (styleEl) {
      styleEl.textContent = '#shell{width:' + w.toFixed(2) + 'px !important;'
        + 'height:' + h.toFixed(2) + 'px !important;}';
    }
  }

  layoutShell();
  window.addEventListener('resize', layoutShell);
  window.addEventListener('orientationchange', function () {
    setTimeout(layoutShell, 50);
    setTimeout(layoutShell, 300);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', layoutShell);
    window.visualViewport.addEventListener('scroll', layoutShell);
  }
  document.addEventListener('DOMContentLoaded', layoutShell);
  // Some in-app browsers (Telegram in particular) finish collapsing their
  // own URL bar / chrome a moment AFTER the page reports loaded, silently
  // resizing the visible area without firing a resize event reliably.
  setTimeout(layoutShell, 300);
  setTimeout(layoutShell, 1000);
  setTimeout(layoutShell, 2000);
})();
</script>

<script>
  window.X2_CHUKO_BUILD = '0.13.20';
  // Samsung Internet / home-screen shortcuts can keep an old document in memory.
  // A build query changes the document URL and therefore forces a fresh HTML load.
  (function() {
    try {
      const u = new URL(location.href);
      if (u.searchParams.get('build') !== '0.13.20') {
        u.searchParams.set('build','0.13.20');
        location.replace(u.toString());
      }
    } catch (_) {}
  })();
</script>
</head>
<body>
<div class="shell" id="shell">
  <div class="bg-layer"></div>

  <div class="render-layer" id="render-host">
    <div class="art-stack" aria-hidden="true">
      <img class="bg-photo" src="assets/background-realistic.webp" alt="">
      <img class="field-photo" src="assets/field-realistic.webp" alt="">
      <div class="field-tone"></div>
      <div class="field-focus"></div>
      <div class="art-vignette"></div>
    </div>
    <canvas id="renderCanvas" touch-action="none" aria-label="3D поле ЧҮКӨ"></canvas>
  </div>

  <div class="ui-layer">
    <div class="topbar">
      <img class="brand-logo" src="assets/logo.svg" alt="X2 LOTO">
      <div class="game-title-inline">
        <div class="game-title-main" data-i18n="title">ЧҮКӨ</div>
        <div class="game-title-sub" data-i18n="subtitle">Выбей Хана</div>
      </div>
      <div class="wallet">
        <div class="wallet-meta"><div class="small-label" data-i18n="balance">Баланс</div><div class="amount" id="balance-value">—</div></div>
        <button class="deposit" id="deposit-btn" aria-label="deposit">+</button>
      </div>
    </div>

    <!-- Player-facing language switch: confirmed behaviour is the game
         starts in whatever language the LMS provides (see
         initializeGameIntegration()), and the player can change it anytime
         from here - not just a QA/debug affordance. Current styling is a
         quick corner toggle for testing all languages easily; feel free to
         ask for a more polished placement/design once the language list is
         final. -->
    <div class="lang-switch" id="lang-switch" title="Язык / Language">
      <button data-lang="RU" type="button">RU</button><button data-lang="EN" type="button">EN</button><button data-lang="KG" type="button">KG</button><button data-lang="ZH" type="button">ZH</button>
    </div>

    <section class="aim-power" id="aimPower" hidden>СИЛА <strong>0%</strong></section>

    <div class="bottom-tools">
      <div class="bottom-controls">
        <div class="mode-switch hidden" id="mode-switch">
          <button data-mode="real">REAL</button><button data-mode="demo">DEMO</button>
        </div>

        <div class="info-wrap">
          <button class="info-btn" id="info-btn" type="button" data-i18n="info">Инфо</button>
          <div class="info-menu" id="info-menu" aria-hidden="true">
            <button id="info-payout" type="button" data-i18n="payoutTable">Таблица выплат</button>
            <button id="info-how" type="button" data-i18n="howToPlay">Как играть</button>
            <button id="info-tickets" type="button" data-i18n="myTickets">Мои билеты</button>
          </div>
        </div>

        <button class="audio-toggle" id="sound-btn" type="button" aria-label="Звук" title="Звук">🔊</button>
        <button class="audio-toggle" id="music-btn" type="button" aria-label="Музыка" title="Музыка">♫×</button>
      </div>

      <div class="ticket-number" id="ticket-number" title="">№ —</div>
    </div>

    <div class="help-modal" id="help-modal" aria-hidden="true">
      <div class="help-dialog">
        <button class="help-close" id="help-close" aria-label="close">×</button>
        <div class="help-title" data-i18n="helpTitle"></div>
        <div class="help-step"><span class="help-num">1</span><span data-i18n="helpPull"></span></div>
        <div class="help-step"><span class="help-num">2</span><span data-i18n="helpScenario"></span></div>
        <div class="help-step"><span class="help-num">3</span><span data-i18n="helpMultiplier"></span></div>
        <div class="help-step"><span class="help-num">4</span><span data-i18n="helpKhan"></span></div>
        <button class="help-ok" id="help-ok" data-i18n="helpOk"></button>
      </div>
    </div>

    <div class="payout-modal" id="payout-modal" aria-hidden="true">
      <div class="payout-dialog">
        <button class="payout-close" id="payout-close" aria-label="close">×</button>
        <div class="payout-modal-title" data-i18n="payoutTable">Таблица выплат</div>
        <div class="payout-grid payout-grid-modal" id="payout-grid"></div>
        <button class="payout-ok" id="payout-ok" data-i18n="helpOk">Понятно</button>
      </div>
    </div>

    <div class="tickets-modal" id="tickets-modal" aria-hidden="true">
      <div class="tickets-dialog">
        <button class="tickets-close" id="tickets-close" aria-label="close">×</button>
        <div class="tickets-title" data-i18n="recentTickets">Последние билеты</div>
        <div class="tickets-list" id="tickets-list"></div>
        <button class="tickets-ok" id="tickets-ok" data-i18n="helpOk">Понятно</button>
      </div>
    </div>

    <div class="celebration-layer" id="celebration-layer" aria-hidden="true"></div>
    <div class="result-toast" id="result-toast"></div>

    <div class="score">
      <div class="score-cell"><div class="score-label" data-i18n="knocked">ВЫБИТО</div><div class="score-value" id="score-knocked">0</div></div>
      <div class="score-cell"><div class="score-label" data-i18n="khan">ХАН</div><div class="score-value gold" id="score-khan">—</div></div>
      <div class="score-cell"><div class="score-label" data-i18n="scoreWin">ВЫИГРЫШ</div><div class="score-value accent" id="score-win">0</div></div>
    </div>

    <div class="action-row">
      <select class="denom-select" id="denom-select" aria-label="Номинал"></select>
      <button class="action" id="action-btn" disabled>Загрузка...</button>
      <button class="autoplay-btn" id="autoplay-btn" type="button">Автоигра</button>

      <div class="autoplay-menu" id="autoplay-menu" aria-hidden="true">
        <div class="autoplay-menu-title" id="autoplay-menu-title">Количество игр</div>
        <div class="autoplay-counts" id="autoplay-counts"></div>
      </div>
    </div>

    <div class="hint-bar" id="hint-bar">
      <span class="hint-text" id="hint-text">Потяните САКА назад и отпустите</span>
      <button class="hint-toggle" id="hint-toggle" type="button" aria-label="Скрыть подсказку">×</button>
    </div>




    <section class="perf" id="perfPanel" aria-live="polite">
      <div><span>FPS</span><strong id="fps">—</strong></div>
      <div><span>frame</span><strong id="frameMs">— ms</strong></div>
      <div><span>bodies</span><strong id="bodyCount">—</strong></div>
      <div><span>scale</span><strong id="renderScale">—</strong></div>
    </section>

    <div class="fatal" id="fatal" hidden>
      <strong>Не удалось запустить игру</strong>
      <span id="fatalText"></span>
    </div>

    <div class="debug">v0.13.20 · Babylon.js 9.25 + Havok · LMS UI из v20.61</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.25.0/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@9.25.0/babylonjs.loaders.min.js"></script>
<script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
<script src="src/config.js?v=0.13.20"></script>
<script src="lms-config.js?v=0.13.20"></script>
<script src="src/scenario-config.js?v=0.13.20"></script>
<script src="lms-adapter.js?v=0.13.20"></script>
<script src="src/i18n.js?v=0.13.20"></script>
<script src="src/game.js?v=0.13.20"></script>
</body>
</html>
